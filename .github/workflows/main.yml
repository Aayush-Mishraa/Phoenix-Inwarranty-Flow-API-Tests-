name: Phoenix In-Warranty Postman API Collection Workflow Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Production schedules (UTC)
    - cron: "30 02 * * *"      # 08:00 AM IST daily
    - cron: "00 14 * * 0-1"    # 07:30 PM IST Sun-Mon

    # Weekday schedules
    - cron: "00 01 * * 2-5"    # 06:30 AM IST Tue-Fri
    - cron: "00 06 * * 2-5"    # 11:30 AM IST Tue-Fri
    - cron: "00 09 * * 2-5"    # 02:30 PM IST Tue-Fri
    - cron: "00 06 * * 1-2"    # 11:30 AM IST Mon-Tue

    # Tue-Wed schedules
    - cron: "00 04 * * 2-3"    # 09:30 AM IST Tue-Wed
    - cron: "00 08 * * 2-3"    # 01:30 PM IST Tue-Wed
    - cron: "00 10 * * 2-3"    # 03:30 PM IST Tue-Wed

    # Staging build
    - cron: "00 05 * * 2-4"    # 10:30 AM IST Tue-Thu

    # Demo/testing schedules
    - cron: "00 02 * * 2-3"    # 07:30 AM IST Tue-Wed
    - cron: "30 02 * * 2-3"    # 08:00 AM IST Tue-Wed
    - cron: "00 03 * * 2-3"    # 08:30 AM IST Tue-Wed
    - cron: "40 05 * * 2-3"    # 11:10 AM IST Tue-Wed
    - cron: "00 11 * * 2-3"    # 04:30 PM IST Tue-Wed
    - cron: "00 12 * * 2-3"    # 05:30 PM IST Tue-Wed
    - cron: "00 13 * * 2-3"    # 06:30 PM IST Tue-Wed
    - cron: "00 16 * * 2-3"    # 09:30 PM IST Tue-Wed
    - cron: "00 17 * * 2-3"    # 10:30 PM IST Tue-Wed
    - cron: "00 18 * * 2-3"    # 11:30 PM IST Tue-Wed
    - cron: "00 19 * * 2-3"    # 12:30 AM IST (next day)
    - cron: "00 20 * * 2-3"    # 01:30 AM IST (next day)

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Install Node.js and npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Newman and HTML Extra globally
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection
        run: |
          newman run 'Main Inwarranty-flow Collection.postman_collection.json' \
            -e QA.postman_environment.json \
            -d testdata.csv \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman/index.html \
            --reporter-htmlextra-showOnlyFails \
            --reporter-htmlextra-omitRequestBodies \
            --reporter-htmlextra-omitResponseBodies

      - name: Upload Newman Report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: newman-html-report
          path: newman/*.html

      - name: Create GitHub HTML page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix In-Warranty Flow | API Automation Test Report (GitHub Actions)
          to: connecttoayushmishra@gmail.com
          from: Phoenix Automation | Aayush Mishra <${{ secrets.EMAIL_ADDRESS }}>
          body: |
            Hello,

            The Phoenix In-Warranty Flow Postman API tests have been successfully executed via GitHub Actions.
            
            Please find the attached HTML test execution report for detailed results.
            You can also view the live report on GitHub Pages using the link below:
            https://aayush-mishraa.github.io/Phoenix-Inwarranty-Flow-API-Tests-/
            
            If you have any questions or need further details, please let me know.
            
            Warm regards,  
            ━━━━━━━━━━━━━━━━━━━━━━━━━━  
            Aayush Mishra  
            SDET | Software Development Engineer in Test  
            Automation • API • CI/CD  
            https://aayushmishra.tech/  
            ━━━━━━━━━━━━━━━━━━━━━━━━━━
